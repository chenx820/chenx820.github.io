name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

# ./deploy.sh owns publishing to gh-pages. CI only validates the build so a
# source push cannot race with the local deployment for the same branch.
permissions:
  contents: read

# Cancel in-progress runs when a new commit is pushed
concurrency:
  group: site-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CI: true
      GATSBY_TELEMETRY_DISABLED: 1
    steps:
      - name: Checkout (with Git LFS)
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Cache Gatsby build
        uses: actions/cache@v4
        with:
          path: |
            .cache
            public
          key: ${{ runner.os }}-gatsby-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-gatsby-${{ hashFiles('package-lock.json') }}-
            ${{ runner.os }}-gatsby-

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build
        run: npm run build
